# =========================================================================
# --- SERVER CONFIGURATIONS ---
# =========================================================================
server.port=8080
server.servlet.context-path=/api

# =========================================================================
# --- POSTGRESQL DATABASE CONFIGURATIONS ---
# =========================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/egov_db
spring.datasource.username=postgres
spring.datasource.password=Vinay#51515
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# --- JPA & HIBERNATE ORM SETTINGS ---
# =========================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# --- FIREBASE SERVICE ACCOUNT PATH ---
# =========================================================================
# The file path to the Firebase Service Account JSON file. 
# You can place this file in the src/main/resources directory.
app.firebase.config-path=classpath:firebase-service-account.json

# =========================================================================
# --- OPENAPI & SWAGGER SETTINGS ---
# =========================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
